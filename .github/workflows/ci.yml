name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill and syntax
        run: python scripts/validate.py
      - name: Run contract and failure tests
        run: python -m unittest discover -s tests -v
      - name: Check TypeScript template loads
        run: node --input-type=module -e "await import('./skills/cloudflare-clef/templates/client.ts')"
      - name: Check browser benchmark syntax
        run: |
          node --check benchmarks/browser.mjs
          node --check benchmarks/clef-browser.mjs
          node --check benchmarks/semantic-browser.mjs
          node --check skills/ego-clef/scripts/browser.mjs
          node --check skills/ego-clef/scripts/semantic.mjs
          node --test tests/*.test.mjs
      - name: Check npm distribution contents
        run: |
          npm pack --dry-run
          cd skills/cloudflare-clef
          npm pack --dry-run
          cd ../ego-clef
          npm pack --dry-run
